name: Redirect GitHub Pages to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Redirect page (the site now lives on Vercel; old links and printed QR codes keep working)
        run: |
          mkdir _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>בית כנסת אדרת אליהו</title>
            <link rel="canonical" href="https://adderet-eliyahu.vercel.app/">
            <meta http-equiv="refresh" content="0; url=https://adderet-eliyahu.vercel.app/">
            <script>location.replace("https://adderet-eliyahu.vercel.app/");</script>
          </head>
          <body><a href="https://adderet-eliyahu.vercel.app/">adderet-eliyahu.vercel.app</a></body>
          </html>
          HTML
          sed -i 's/^          //' _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
